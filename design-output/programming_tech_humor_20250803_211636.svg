<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect x="10" y="15" width="360" height="250" fill="#F7F7F7"/>
    
    <!-- Text -->
    <text x="20" y="50" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">
        Debugging is like searching for a needle in a haystack
    </text>
    <text x="120" y="70" text-anchor="middle" font-size="18" font-family="Open Sans, sans-serif">
        But the haystack is on fire and the needle is sleep-deprived
    </text>
    
    <!-- Gradient shadow -->
    <defs>
        <linearGradient id="shadow-gradient" x1="0%" y1="100%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#000" stop-opacity=".5"/>
            <stop offset="100%" stop-color="#333" stop-opacity=".2"/>
        </linearGradient>
    </defs>
    
    <!-- Text with shadow -->
    <text x="20" y="50" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">
        Debugging is like searching for a needle in a haystack
    </text>
    <text x="120" y="70" text-anchor="middle" font-size="18" font-family="Open Sans, sans-serif">
        But the haystack is on fire and the needle is sleep-deprived
    </text>
    <text x="20" y="50" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">
        <tspan font-size="18" font-weight="bold">-</tspan> 3 AM
    </text>
    
    <!-- Gradient shadow under text -->
    <rect x="10" y="55" width="340" height="195" fill="url(#shadow-gradient)"/>
    
    <!-- Silhouette of a cup with steam -->
    <path d="M100,230 L150,220 L170,200 L190,180 L210,160 L230,140 L250,120 L270,100 L290,80 L310,60 L330,40 L350,20 Z" stroke="#333" stroke-width="2"/>
</svg>