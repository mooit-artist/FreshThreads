<svg viewBox="0 0 400 300">
  <!-- Background -->
  <rect x="10" y="10" width="380" height="280" fill="#222222"/>
  
  <!-- Character -->
  <g transform="translate(190, 140)">
    <circle cx="20" cy="20" r="30" fill="#ffffff"/>
    <circle cx="50" cy="50" r="20" fill="#ffffff"/>
    <rect x="60" y="70" width="80" height="40" fill="#ff0000"/> <!-- Power-up -->
    <text x="35" y="85" font-size="30" font-family="Pixelated">Respawn, baby!</text>
  </g>
  
  <!-- Boss -->
  <g transform="translate(220, 170)">
    <rect x="20" y="20" width="60" height="60" fill="#000000"/> <!-- Black background for pixel art -->
    <rect x="30" y="40" width="50" height="20" fill="#ff00ff"/> <!-- Pink pixels -->
    <rect x="10" y="70" width="50" height="20" fill="#00ff00"/> <!-- Green pixels -->
    <text x="35" y="95" font-size="30" font-family="Pixelated">BOSS</text>
  </g>
  
  <!-- Easter Eggs -->
  <g transform="translate(250, 220)">
    <rect x="20" y="20" width="40" height="40" fill="#ffffff"/> <!-- White pixel art -->
    <text x="30" y="50" font-size="15" font-family="8-Bit Madness">Easter Egg 1</text>
    <rect x="60" y="20" width="40" height="40" fill="#ff0000"/> <!-- Red pixels -->
    <text x="70" y="50" font-size="15" font-family="8-Bit Madness">Easter Egg 2</text>
  </g>
  
  <!-- Console -->
  <rect x="10" y="270" width="300" height="30" fill="#222222"/> <!-- Black console background -->
  <text x="15" y="275" font-size="20" font-family="Pixelated">NES Classic</text>
</svg>