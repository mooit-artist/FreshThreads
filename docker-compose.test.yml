version: '3.8'

services:
  # Unit tests
  unit-tests:
    build:
      context: .
      target: testing
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    command: >
      sh -c "
        echo '🧪 Running unit tests...' &&
        make lint-html &&
        make lint-css &&
        make lint-js &&
        make lint-json &&
        echo '✅ Unit tests completed!'
      "
    networks:
      - test-network

  # Integration tests
  integration-tests:
    build:
      context: .
      target: testing
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    command: >
      sh -c "
        echo '🔗 Running integration tests...' &&
        make validate &&
        make python-setup &&
        make analyze-html &&
        echo '✅ Integration tests completed!'
      "
    networks:
      - test-network

  # Security tests
  security-tests:
    build:
      context: .
      target: testing
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
      - ./security-reports:/app/security-reports
    environment:
      - NODE_ENV=test
    command: >
      sh -c "
        echo '🔒 Running security tests...' &&
        make csp-validate &&
        make security-scan || true &&
        echo '✅ Security tests completed!'
      "
    networks:
      - test-network

  # End-to-end tests with headless browser
  e2e-tests:
    image: zenika/alpine-chrome:latest
    working_dir: /app
    volumes:
      - .:/app
    environment:
      - NODE_ENV=test
    command: >
      sh -c "
        apk add --no-cache nodejs npm curl &&
        echo '🌐 Starting test server...' &&
        cd /app &&
        npm install &&
        npm run dev &
        sleep 10 &&
        echo '🧪 Running E2E tests...' &&
        curl -f http://localhost:5500 &&
        curl -f http://localhost:5500/about.html &&
        curl -f http://localhost:5500/products.html &&
        curl -f http://localhost:5500/contact.html &&
        echo '✅ E2E tests completed!'
      "
    networks:
      - test-network

  # Accessibility tests
  accessibility-tests:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "
        echo '♿ Running accessibility tests...' &&
        npm install -g pa11y &&
        npm run dev &
        sleep 10 &&
        pa11y http://localhost:5500 --reporter json > accessibility-report.json || true &&
        pa11y http://localhost:5500/about.html --reporter json >> accessibility-report.json || true &&
        pa11y http://localhost:5500/products.html --reporter json >> accessibility-report.json || true &&
        echo '✅ Accessibility tests completed! Check accessibility-report.json'
      "
    networks:
      - test-network

  # Load testing
  load-tests:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache apache2-utils curl &&
        echo '⚡ Running load tests...' &&
        echo 'Waiting for production server...' &&
        sleep 15 &&
        echo 'Testing concurrent users...' &&
        ab -n 1000 -c 50 -t 30 http://prod-server/ &&
        echo 'Testing sustained load...' &&
        ab -n 500 -c 25 -t 60 http://prod-server/ &&
        echo '📊 Load tests completed!'
      "
    depends_on:
      - prod-server
    networks:
      - test-network

  # Production server for testing
  prod-server:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    networks:
      - test-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  test-network:
    driver: bridge
