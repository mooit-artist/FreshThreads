<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Printify Store ID</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #ff6b35;
        }
        h1 {
            color: #ff6b35;
            text-align: center;
        }
        .input-group {
            margin: 20px 0;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #555;
            border-radius: 5px;
            background: #333;
            color: #fff;
            font-size: 16px;
        }
        button {
            background: #ff6b35;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin: 10px 0;
        }
        button:hover {
            background: #e55a2b;
        }
        .results {
            margin-top: 20px;
            padding: 15px;
            background: #333;
            border-radius: 5px;
            white-space: pre-wrap;
            font-family: monospace;
        }
        .store-card {
            background: #444;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #ff6b35;
        }
        .store-id {
            font-size: 18px;
            font-weight: bold;
            color: #74c0fc;
        }
        .copy-btn {
            background: #28a745;
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 10px;
        }
        .error {
            color: #ff4757;
            background: #2d1b1b;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #ff4757;
        }
        .success {
            color: #2ed573;
            background: #1b2d1b;
            padding: 10px;
            border-radius: 5px;
            border-left: 4px solid #2ed573;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏪 Get Your Printify Store ID</h1>

        <div class="input-group">
            <label for="apiKey">Enter your Printify API Token:</label>
            <input type="password" id="apiKey" placeholder="Enter your Printify API token here">
            <small style="color: #999;">This will be used securely and not stored anywhere</small>
        </div>

        <button onclick="getStores()">Get My Store ID</button>

        <div id="results"></div>
    </div>

    <script>
        async function getStores() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const resultsDiv = document.getElementById('results');

            if (!apiKey) {
                resultsDiv.innerHTML = '<div class="error">Please enter your Printify API token first!</div>';
                return;
            }

            resultsDiv.innerHTML = '<div style="color: #74c0fc;">🔄 Fetching your stores...</div>';

            try {
                const response = await fetch('https://api.printify.com/v1/shops.json', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json',
                        'User-Agent': 'FreshThreads/1.0'
                    }
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status} - ${response.statusText}`);
                }

                const stores = await response.json();

                if (!stores || stores.length === 0) {
                    resultsDiv.innerHTML = '<div class="error">No stores found! Make sure you have created an API store in your Printify dashboard.</div>';
                    return;
                }

                let html = '<div class="success">✅ Found your stores!</div>';

                stores.forEach((store, index) => {
                    html += `
                        <div class="store-card">
                            <h3>Store ${index + 1}: ${store.title}</h3>
                            <div class="store-id">
                                Store ID: ${store.id}
                                <button class="copy-btn" onclick="copyToClipboard('${store.id}')">Copy ID</button>
                            </div>
                            <p><strong>Status:</strong> ${store.status || 'Active'}</p>
                            <p><strong>Platform:</strong> ${store.platform || 'API'}</p>
                            <p><strong>Created:</strong> ${store.created_at || 'Unknown'}</p>
                        </div>
                    `;
                });

                html += `
                    <div style="margin-top: 20px; padding: 15px; background: #1a4f1a; border-radius: 5px;">
                        <h3>✅ Next Steps:</h3>
                        <ol>
                            <li>Copy the Store ID from above (click the "Copy ID" button)</li>
                            <li>Open your <code>/docs/assets/js/config.js</code> file</li>
                            <li>Replace <code>YOUR_SHOP_ID_HERE</code> with your actual Store ID</li>
                            <li>Save the file and test your connection in the POD Admin</li>
                        </ol>
                    </div>
                `;

                resultsDiv.innerHTML = html;

            } catch (error) {
                console.error('Error fetching stores:', error);
                resultsDiv.innerHTML = `
                    <div class="error">
                        <strong>Error:</strong> ${error.message}
                        <br><br>
                        <strong>Possible issues:</strong>
                        <ul>
                            <li>Invalid API token</li>
                            <li>Token doesn't have proper permissions (needs shops:read)</li>
                            <li>No stores created in your Printify account</li>
                            <li>Network connection issue</li>
                        </ul>
                    </div>
                `;
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(function() {
                // Show temporary success message
                const button = event.target;
                const originalText = button.textContent;
                button.textContent = 'Copied!';
                button.style.background = '#2ed573';

                setTimeout(() => {
                    button.textContent = originalText;
                    button.style.background = '#28a745';
                }, 2000);
            }).catch(function(err) {
                console.error('Could not copy text: ', err);
                // Fallback for older browsers
                const textArea = document.createElement('textarea');
                textArea.value = text;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('Store ID copied to clipboard: ' + text);
            });
        }

        // Allow Enter key to trigger the search
        document.getElementById('apiKey').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                getStores();
            }
        });
    </script>
</body>
</html>
