<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="12in" height="12in" viewBox="0 0 1200 1200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .main-text {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 72px;
        font-weight: bold;
        fill: #032B44;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Arial', 'Helvetica', sans-serif;
        font-size: 36px;
        font-weight: normal;
        fill: #75737A;
        text-anchor: middle;
      }
      .accent-line {
        stroke: #66CC69;
        stroke-width: 4;
      }
    </style>
  </defs>

  <!-- Background (transparent) -->
  <rect width="1200" height="1200" fill="none"/>

  <!-- Accent line -->
  <line x1="400" y1="320" x2="800" y2="320" class="accent-line"/>

  <!-- Main text: CODE CRUSADE -->
  <text x="600" y="380" class="main-text">CODE CRUSADE</text>

  <!-- Subtitle -->
  <text x="600" y="440" class="subtitle">Write Code, Change World</text>

</svg>
