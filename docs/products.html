                align-items: center;
                justify-content: center;
                border-radius: 50%;

                height: 60px;

                border-radius: 8px;

            .cart-item-details p {

                font-size: 0.9rem;

                margin-right: 0.5rem;

            .cart-item-quantity {

                align-items: center;
                gap: 0.5rem;

                justify-content: center;

            .cart-item-quantity button:hover {

                color: var(--text-primary, #ffffff);

                color: white;
                border: none;
                padding: 12px;
                border-radius: 8px;
                font-size: 1rem;
                font-weight: bold;
                cursor: pointer;
                transition: background 0.3s;

                border: 1px solid rgba(255, 255, 255, 0.2);
                margin-bottom: 2rem;

                gap: 1rem;
                align-items: center;
                justify-content: center;
                flex-wrap: wrap;

            .filter-group {

                flex-direction: column;
                gap: 0.5rem;

            .filter-label {
                font-size: 0.9rem;
                opacity: 0.8;

            .filter-select {

            .filter-select option {
                background: #333;
                color: white;

            .products-section {

                margin-bottom: 2rem;

                cursor: pointer;

                border: 1px solid #000000;

                background: #000000;
                color: #ffffff;

                color: white;

                font-size: 1.2rem;

            .product-description {

                margin-bottom: 1rem;
                line-height: 1.4;

            .product-price {

                color: var(--text-primary, #ffffff);

                flex-wrap: wrap;

                margin-bottom: 1rem;
                flex-wrap: wrap;

            .size-btn {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.3);
                padding: 0.3rem 0.8rem;
                border-radius: 5px;
                cursor: pointer;
                font-size: 0.9rem;
                transition: all 0.3s ease;
            }

            .size-btn:hover,

                background: #ffd700;
                color: var(--text-dark, #000000);
                border-color: #ffd700;

            .product-actions {
                display: flex;
                gap: 0.5rem;
            }

            .add-to-cart-btn {
                flex: 1;
                background: #000000;
                color: #ffffff;
                border: 2px solid #ffffff;
                padding: 0.8rem;
                border-radius: 10px;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s ease;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            }

            .add-to-cart-btn:hover {
                background: #ffffff;
                color: #000000;
                transform: translateY(-2px);
                box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
            }

            .wishlist-btn {
                background: rgba(255, 255, 255, 0.1);
                color: white;
                border: 1px solid rgba(255, 255, 255, 0.3);
                padding: 0.8rem;
                border-radius: 10px;
                cursor: pointer;
                transition: all 0.3s ease;
                font-size: 1.2rem;
            }

            .wishlist-btn:hover,
            .wishlist-btn.active {
                background: #ffffff;
                border-color: #ffffff;
                color: #000000;
            }

            .printify-status {
                background: rgba(255, 255, 255, 0.1);
                border-radius: 10px;
                padding: 1rem;
                margin-bottom: 1rem;
                text-align: center;
            }

            .status-indicator {
                display: inline-block;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                margin-right: 0.5rem;
            }

            .status-connected {
                background: #ffffff;
            }

            .status-disconnected {
                background: #000000;
            }

            .loading {
                text-align: center;
                padding: 2rem;
                opacity: 0.7;
            }

            .error {
                background: rgba(255, 255, 255, 0.1);
                color: #ffffff;
                padding: 1rem;
                border-radius: 8px;
                border: 1px solid #ffffff;
                margin-bottom: 1rem;
            }

            .success {
                background: rgba(255, 255, 255, 0.1);
                color: #ffffff;
                padding: 1rem;
                border-radius: 8px;
                border: 1px solid #ffffff;
                margin-bottom: 1rem;
            }

            @media (max-width: 768px) {
                .header {
                    padding: 1rem;
                    flex-direction: column;
                    gap: 1rem;
                }

                .container {
                    padding: 1rem;
                }

                .page-header h1 {
                    font-size: 2rem;
                }

                .stats-grid {
                    grid-template-columns: repeat(2, 1fr);
                }

                .actions-grid {
                    grid-template-columns: 1fr;
                }

                .products-header {
                    flex-direction: column;
                    gap: 1rem;
                    align-items: stretch;
                }

                .filter-controls {
                    justify-content: center;
                }
            }
        </style>

                    // Update search results count display

                        searchResultsCount.style.display = 'block';

                        searchResultsCount.style.display = 'none';

                    // Apply price filter
                    if (priceFilter !== 'all') {
                        const [min, max] = priceFilter.split('-').map(p => p.replace('+', ''));
                        filteredProducts = filteredProducts.filter(p => {
                            if (max) {
                                return p.price >= parseInt(min) && p.price <= parseInt(max);

                                return p.price >= parseInt(min);
                            }

                    // Apply sorting

                        case 'price-low':
                            filteredProducts.sort((a, b) => a.price - b.price);
