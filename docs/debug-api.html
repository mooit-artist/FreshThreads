<!DOCTYPE html>
<html lang="en">
<head>
    <title>API Endpoint Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #fff; }
        .output { background: #222; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { color: #4CAF50; }
        .error { color: #f44336; }
        .info { color: #2196F3; }
    </style>
</head>
<body>
    <h1>API Debug Test</h1>
    <div id="output"></div>
    <script src="assets/js/config.js"></script>
    <script>
        const output = document.getElementById('output');

        function log(msg, type = 'info') {
            console.log(msg);
            const div = document.createElement('div');
            div.className = `output ${type}`;
            div.innerHTML = msg;
            output.appendChild(div);
        }

        log('Window location: ' + window.location.href, 'info');
        log('Is Docker: ' + window.apiConfig.isDocker, 'info');
        log('Backend URL: ' + window.apiConfig.getBackendUrl(), 'info');

        // Test the API endpoint
        async function testAPI() {
            const backendUrl = window.apiConfig.getBackendUrl();
            const testUrl = `${backendUrl}/health`;
            log('Testing: ' + testUrl, 'info');

            try {
                const response = await fetch(testUrl);
                log('Response status: ' + response.status, response.ok ? 'success' : 'error');
                const data = await response.json();
                log('Response data: ' + JSON.stringify(data, null, 2), 'success');

                // If health works, test products
                if (response.ok) {
                    await testProducts(backendUrl);
                }
            } catch (error) {
                log('Error: ' + error.message, 'error');
                log('Error details: ' + error.toString(), 'error');
            }
        }

        async function testProducts(backendUrl) {
            const productsUrl = `${backendUrl}/api/printify/shops/6563836/products.json`;
            log('Testing products: ' + productsUrl, 'info');

            try {
                const response = await fetch(productsUrl);
                log('Products response status: ' + response.status, response.ok ? 'success' : 'error');
                if (response.ok) {
                    const data = await response.json();
                    log('Products count: ' + (data.data ? data.data.length : 'No data'), 'success');
                    if (data.data && data.data.length > 0) {
                        log('First product: ' + data.data[0].title, 'success');
                    }
                } else {
                    const text = await response.text();
                    log('Products error response: ' + text, 'error');
                }
            } catch (error) {
                log('Products error: ' + error.message, 'error');
            }
        }

        testAPI();
    </script>
</body>
</html>
