<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshThreads - Team Access</title>
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co https://*.firebase.googleapis.com https://api.airtable.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
            text-align: center;
            color: white;
        }

        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            color: white;
            text-decoration: none;
            font-size: 1.5rem;
            opacity: 0.8;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 1;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            font-size: 1.1rem;
            margin-bottom: 2rem;
            opacity: 0.9;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group {
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ffd700;
            box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.2);
            background: rgba(255, 255, 255, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .auth-button {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #333;
            border: none;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        .auth-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(255, 0, 0, 0.3);
            display: none;
            margin-bottom: 1rem;
        }

        .success-message {
            background: rgba(0, 255, 0, 0.2);
            color: #51cf66;
            padding: 0.8rem;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 0, 0.3);
            display: none;
            margin-bottom: 1rem;
        }

        .divider {
            margin: 2rem 0;
            text-align: center;
            position: relative;
            opacity: 0.6;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            background: transparent;
            padding: 0 1rem;
        }

        .demo-credentials {
            background: rgba(255, 255, 255, 0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .demo-credentials strong {
            color: #ffd700;
        }

        @media (max-width: 768px) {
            .auth-container {
                padding: 2rem;
                margin: 1rem;
            }
            
            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back</a>
    
    <div class="auth-container">
        <div class="logo">🔐 FreshThreads</div>
        <div class="subtitle">Team Access Portal</div>
        
        <div class="demo-credentials">
            <strong>Demo Access:</strong><br>
            Email: demo@freshthreads.com<br>
            Password: demo123
        </div>
        
        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>
        
        <form class="auth-form" id="authForm">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="auth-button" id="authButton">
                Sign In
            </button>
        </form>
        
        <div class="divider">
            <span>or</span>
        </div>
        
        <button class="auth-button" onclick="signInWithGoogle()" style="margin-top: 0;">
            Continue with Google
        </button>
    </div>

    <script>
        'use strict';
        
        (function() {
            // Authentication configuration
            const AUTH_CONFIG = {
                demoCredentials: {
                    email: 'demo@freshthreads.com',
                    password: 'demo123'
                },
                sessionKey: 'freshthreads_auth',
                dashboardUrl: 'dashboard.html'
            };
            
            // DOM elements
            const authForm = document.getElementById('authForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const authButton = document.getElementById('authButton');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            // Utility functions
            function showError(message) {
                errorMessage.textContent = message;
                errorMessage.style.display = 'block';
                successMessage.style.display = 'none';
            }
            
            function showSuccess(message) {
                successMessage.textContent = message;
                successMessage.style.display = 'block';
                errorMessage.style.display = 'none';
            }
            
            function hideMessages() {
                errorMessage.style.display = 'none';
                successMessage.style.display = 'none';
            }
            
            function setLoading(isLoading) {
                authButton.disabled = isLoading;
                authButton.textContent = isLoading ? 'Signing In...' : 'Sign In';
            }
            
            function createSession(userData) {
                const session = {
                    user: userData,
                    timestamp: Date.now(),
                    expires: Date.now() + (24 * 60 * 60 * 1000) // 24 hours
                };
                
                localStorage.setItem(AUTH_CONFIG.sessionKey, JSON.stringify(session));
                return session;
            }
            
            function redirectToDashboard() {
                showSuccess('Authentication successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = AUTH_CONFIG.dashboardUrl;
                }, 1500);
            }
            
            // Demo authentication
            function authenticateDemo(email, password) {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        if (email === AUTH_CONFIG.demoCredentials.email && 
                            password === AUTH_CONFIG.demoCredentials.password) {
                            resolve({
                                id: 'demo-user',
                                email: email,
                                name: 'Demo User',
                                role: 'admin'
                            });
                        } else {
                            reject(new Error('Invalid credentials'));
                        }
                    }, 1000); // Simulate network delay
                });
            }
            
            // Real authentication (replace with your chosen service)
            async function authenticateWithService(email, password) {
                // Example with Supabase (uncomment and configure when ready)
                /*
                try {
                    const response = await fetch('YOUR_SUPABASE_URL/auth/v1/token?grant_type=password', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'apikey': 'YOUR_SUPABASE_ANON_KEY'
                        },
                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    });
                    
                    if (!response.ok) {
                        throw new Error('Authentication failed');
                    }
                    
                    const data = await response.json();
                    return data.user;
                } catch (error) {
                    throw error;
                }
                */
                
                // For now, fallback to demo auth
                return authenticateDemo(email, password);
            }
            
            // Google Sign-In (placeholder)
            window.signInWithGoogle = function() {
                showError('Google Sign-In coming soon! Use demo credentials for now.');
            };
            
            // Form submission handler
            authForm.addEventListener('submit', async function(e) {
                e.preventDefault();
                hideMessages();
                setLoading(true);
                
                try {
                    const email = emailInput.value.trim();
                    const password = passwordInput.value;
                    
                    if (!email || !password) {
                        throw new Error('Please fill in all fields');
                    }
                    
                    const userData = await authenticateWithService(email, password);
                    createSession(userData);
                    redirectToDashboard();
                    
                } catch (error) {
                    showError(error.message || 'Authentication failed. Please try again.');
                } finally {
                    setLoading(false);
                }
            });
            
            // Check if user is already authenticated
            function checkExistingSession() {
                try {
                    const sessionData = localStorage.getItem(AUTH_CONFIG.sessionKey);
                    if (sessionData) {
                        const session = JSON.parse(sessionData);
                        if (session.expires > Date.now()) {
                            // Valid session exists, redirect to dashboard
                            window.location.href = AUTH_CONFIG.dashboardUrl;
                            return;
                        } else {
                            // Session expired, remove it
                            localStorage.removeItem(AUTH_CONFIG.sessionKey);
                        }
                    }
                } catch (error) {
                    console.error('Session check error:', error);
                    localStorage.removeItem(AUTH_CONFIG.sessionKey);
                }
            }
            
            // Initialize
            document.addEventListener('DOMContentLoaded', function() {
                checkExistingSession();
                emailInput.focus();
            });
            
        })();
    </script>
</body>
</html>
