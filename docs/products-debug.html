<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Products Debug Test</title>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/print-on-demand.js"></script>
</head>
<body>
    <h1>Products Loading Test</h1>
    <div id="output"></div>
    <script>
        const output = document.getElementById('output');

        function log(msg) {
            console.log(msg);
            output.innerHTML += `<p>${msg}</p>`;
        }

        async function testProducts() {
            log('Starting product loading test...');
            log(`Current URL: ${window.location.href}`);
            log(`Backend URL: ${window.apiConfig.getBackendUrl()}`);

            // Initialize the POD manager
            const podManager = new PrintOnDemandManager();
            log(`Shop ID: ${podManager.printifyShopId}`);

            try {
                log('Fetching products...');
                const products = await podManager.getPrintifyProducts();
                log(`Retrieved ${products.length} products`);

                if (products.length > 0) {
                    log(`First product: ${products[0].title}`);
                } else {
                    log('No products found - checking connection...');

                    // Test the backend directly
                    const backendUrl = window.apiConfig.getBackendUrl();
                    const healthUrl = `${backendUrl}/health`;
                    log(`Testing health endpoint: ${healthUrl}`);

                    try {
                        const healthResponse = await fetch(healthUrl);
                        log(`Health status: ${healthResponse.status}`);
                        if (healthResponse.ok) {
                            const healthData = await healthResponse.json();
                            log(`Health data: ${JSON.stringify(healthData)}`);
                        }
                    } catch (healthError) {
                        log(`Health check failed: ${healthError.message}`);
                    }
                }
            } catch (error) {
                log(`Error: ${error.message}`);
            }
        }

        // Run the test when page loads
        window.addEventListener('load', testProducts);
    </script>
</body>
</html>
