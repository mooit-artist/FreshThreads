<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Management - FreshThreads LLC</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #F7F7F4;
        color: #191919;
        line-height: 1.6;
      }

      .header {
        background: #191919;
        color: white;
        padding: 1rem 0;
      }

      .nav-container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .logo {
        font-size: 1.5rem;
        font-weight: bold;
      }

      .main-container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 2rem;
      }

      .toolbar {
        background: white;
        border-radius: 8px;
        border: 1px solid #E0E0E0;
        padding: 1.5rem;
        margin-bottom: 2rem;
        display: flex;
        gap: 1rem;
        align-items: center;
        flex-wrap: wrap;
      }

      .search-input {
        flex: 1;
        min-width: 200px;
        padding: 0.75rem;
        border: 1px solid #E0E0E0;
        border-radius: 4px;
        font-size: 1rem;
      }

      .filter-select {
        padding: 0.75rem;
        border: 1px solid #E0E0E0;
        border-radius: 4px;
        font-size: 1rem;
        min-width: 150px;
      }

      .action-button {
        background: #191919;
        color: white;
        border: none;
        padding: 0.75rem 1.5rem;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.3s ease;
        text-decoration: none;
        display: inline-block;
      }

      .action-button:hover {
        background: #333;
      }

      .action-button.secondary {
        background: #6C757D;
      }

      .action-button.danger {
        background: #DC3545;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      .stat-card {
        background: white;
        border-radius: 8px;
        border: 1px solid #E0E0E0;
        padding: 1.5rem;
        text-align: center;
      }

      .stat-icon {
        font-size: 2rem;
        margin-bottom: 0.5rem;
        display: block;
      }

      .stat-value {
        font-size: 1.8rem;
        font-weight: bold;
        color: #191919;
        margin-bottom: 0.25rem;
      }

      .stat-label {
        color: #666;
        font-size: 0.9rem;
      }

      .inventory-table {
        background: white;
        border-radius: 8px;
        border: 1px solid #E0E0E0;
        overflow: hidden;
      }

      .table-header {
        background: #F8F9FA;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #E0E0E0;
        font-weight: 600;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .table-content {
        max-height: 600px;
        overflow-y: auto;
      }

      .product-row {
        display: grid;
        grid-template-columns: 60px 1fr 120px 100px 100px 120px 150px;
        align-items: center;
        padding: 1rem 1.5rem;
        border-bottom: 1px solid #F0F0F0;
        gap: 1rem;
      }

      .product-row:hover {
        background: #F8F9FA;
      }

      .product-image {
        font-size: 2rem;
        text-align: center;
      }

      .product-info {
        display: flex;
        flex-direction: column;
      }

      .product-name {
        font-weight: 600;
        margin-bottom: 0.25rem;
      }

      .product-sku {
        color: #666;
        font-size: 0.85rem;
      }

      .stock-level {
        font-weight: 600;
        text-align: center;
      }

      .stock-level.low {
        color: #DC3545;
      }

      .stock-level.medium {
        color: #FFC107;
      }

      .stock-level.high {
        color: #28A745;
      }

      .status-badge {
        padding: 0.25rem 0.75rem;
        border-radius: 12px;
        font-size: 0.8rem;
        font-weight: 600;
        text-align: center;
      }

      .status-active {
        background: #D4EDDA;
        color: #155724;
      }

      .status-low {
        background: #F8D7DA;
        color: #721C24;
      }

      .status-out {
        background: #F1F1F1;
        color: #6C757D;
      }

      .actions {
        display: flex;
        gap: 0.5rem;
      }

      .action-btn {
        background: none;
        border: 1px solid #E0E0E0;
        border-radius: 4px;
        padding: 0.5rem;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 0.9rem;
      }

      .action-btn:hover {
        background: #F8F9FA;
        border-color: #191919;
      }

      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
        z-index: 1000;
      }

      .modal-content {
        background: white;
        margin: 5% auto;
        padding: 2rem;
        border-radius: 8px;
        max-width: 500px;
        width: 90%;
      }

      .modal-header {
        margin-bottom: 1.5rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid #E0E0E0;
      }

      .form-group {
        margin-bottom: 1.5rem;
      }

      .form-label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
        color: #191919;
      }

      .form-input {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #E0E0E0;
        border-radius: 4px;
        font-size: 1rem;
      }

      .form-input:focus {
        outline: none;
        border-color: #191919;
      }

      .form-actions {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 1.5rem;
        cursor: pointer;
        float: right;
        margin-top: -0.5rem;
      }

      @media (max-width: 768px) {
        .product-row {
          grid-template-columns: 1fr;
          text-align: left;
          gap: 0.5rem;
        }

        .toolbar {
          flex-direction: column;
          align-items: stretch;
        }

        .search-input {
          margin-bottom: 1rem;
        }

        .stats-grid {
          grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        }

        .nav-container {
          padding: 0 1rem;
        }

        .main-container {
          padding: 0 1rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header class="header">
      <div class="nav-container">
        <div class="logo">FreshThreads Inventory</div>
        <div>
          <a href="dashboard.html" style="color: white; text-decoration: none;">← Back to Dashboard</a>
        </div>
      </div>
    </header>

    <div class="main-container">
      <!-- Toolbar -->
      <div class="toolbar">
        <input type="text" class="search-input" placeholder="Search products..." id="searchInput">

        <select class="filter-select" id="categoryFilter">
          <option value="">All Categories</option>
          <option value="apparel">Apparel</option>
          <option value="accessories">Accessories</option>
          <option value="home">Home & Living</option>
          <option value="stationery">Stationery</option>
        </select>

        <select class="filter-select" id="statusFilter">
          <option value="">All Status</option>
          <option value="active">Active</option>
          <option value="low">Low Stock</option>
          <option value="out">Out of Stock</option>
        </select>

        <button class="action-button" onclick="openAddProductModal()">+ Add Product</button>
        <button class="action-button secondary" onclick="exportInventory()">Export CSV</button>
      </div>

      <!-- Stats -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">📦</span>
          <div class="stat-value" id="totalProducts">24</div>
          <div class="stat-label">Total Products</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">✅</span>
          <div class="stat-value" id="activeProducts">21</div>
          <div class="stat-label">Active Products</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">⚠️</span>
          <div class="stat-value" id="lowStockProducts">5</div>
          <div class="stat-label">Low Stock</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">❌</span>
          <div class="stat-value" id="outOfStockProducts">3</div>
          <div class="stat-label">Out of Stock</div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💰</span>
          <div class="stat-value" id="totalInventoryValue">$47.2K</div>
          <div class="stat-label">Inventory Value</div>
        </div>
      </div>

      <!-- Inventory Table -->
      <div class="inventory-table">
        <div class="table-header">
          <span>Product Inventory</span>
          <span id="productCount">24 products</span>
        </div>

        <div class="table-content" id="productTable">
          <!-- Products will be dynamically loaded here -->
        </div>
      </div>
    </div>

    <!-- Add/Edit Product Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Add New Product</h3>
          <button class="close-btn" onclick="closeProductModal()">&times;</button>
        </div>

        <form id="productForm">
          <div class="form-group">
            <label class="form-label" for="productName">Product Name</label>
            <input type="text" class="form-input" id="productName" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="productSku">SKU</label>
            <input type="text" class="form-input" id="productSku" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="productCategory">Category</label>
            <select class="form-input" id="productCategory" required>
              <option value="">Select Category</option>
              <option value="apparel">Apparel</option>
              <option value="accessories">Accessories</option>
              <option value="home">Home & Living</option>
              <option value="stationery">Stationery</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="productPrice">Price ($)</label>
            <input type="number" class="form-input" id="productPrice" step="0.01" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="productStock">Stock Quantity</label>
            <input type="number" class="form-input" id="productStock" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="productThreshold">Low Stock Threshold</label>
            <input type="number" class="form-input" id="productThreshold" required>
          </div>

          <div class="form-actions">
            <button type="button" class="action-button secondary" onclick="closeProductModal()">Cancel</button>
            <button type="submit" class="action-button">Save Product</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      'use strict';

      // Sample inventory data
      let inventory = [
        {
          id: 1,
          name: 'Fresh Threads Logo Tee',
          sku: 'FT-TEE-001',
          category: 'apparel',
          price: 24.99,
          stock: 127,
          threshold: 20,
          icon: '👕',
          status: 'active'
        },
        {
          id: 2,
          name: 'Trendy Graphic Hoodie',
          sku: 'FT-HOOD-001',
          category: 'apparel',
          price: 39.99,
          stock: 89,
          threshold: 15,
          icon: '🧥',
          status: 'active'
        },
        {
          id: 3,
          name: 'Coffee Lover Mug',
          sku: 'FT-MUG-001',
          category: 'home',
          price: 14.99,
          stock: 64,
          threshold: 30,
          icon: '☕',
          status: 'active'
        },
        {
          id: 4,
          name: 'Vintage Style Cap',
          sku: 'FT-CAP-001',
          category: 'accessories',
          price: 19.99,
          stock: 41,
          threshold: 25,
          icon: '🧢',
          status: 'active'
        },
        {
          id: 5,
          name: 'Minimalist Tote Bag',
          sku: 'FT-TOTE-001',
          category: 'accessories',
          price: 16.99,
          stock: 23,
          threshold: 15,
          icon: '👜',
          status: 'active'
        },
        {
          id: 6,
          name: 'Eco-Friendly Notebook',
          sku: 'FT-NOTE-001',
          category: 'stationery',
          price: 12.99,
          stock: 8,
          threshold: 20,
          icon: '📓',
          status: 'low'
        },
        {
          id: 7,
          name: 'Sunset Design Poster',
          sku: 'FT-POST-001',
          category: 'home',
          price: 9.99,
          stock: 0,
          threshold: 10,
          icon: '🖼️',
          status: 'out'
        }
      ];

      let editingProductId = null;

      // Initialize the page
      function initializePage() {
        renderInventoryTable();
        updateStats();

        // Add event listeners
        document.getElementById('searchInput').addEventListener('input', filterProducts);
        document.getElementById('categoryFilter').addEventListener('change', filterProducts);
        document.getElementById('statusFilter').addEventListener('change', filterProducts);
        document.getElementById('productForm').addEventListener('submit', saveProduct);
      }

      // Render the inventory table
      function renderInventoryTable(products = inventory) {
        const tableContent = document.getElementById('productTable');

        if (products.length === 0) {
          tableContent.innerHTML = '<div style="padding: 2rem; text-align: center; color: #666;">No products found</div>';
          return;
        }

        tableContent.innerHTML = products.map(product => {
          const stockStatus = getStockStatus(product);
          const statusClass = getStatusClass(product.status);

          return `
                    <div class="product-row">
                        <div class="product-image">${product.icon}</div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-sku">SKU: ${product.sku}</div>
                        </div>
                        <div>$${product.price.toFixed(2)}</div>
                        <div class="stock-level ${stockStatus.class}">${product.stock}</div>
                        <div>${product.threshold}</div>
                        <div class="status-badge ${statusClass}">${getStatusText(product.status)}</div>
                        <div class="actions">
                            <button class="action-btn" onclick="editProduct(${product.id})" title="Edit">✏️</button>
                            <button class="action-btn" onclick="updateStock(${product.id})" title="Update Stock">📦</button>
                            <button class="action-btn" onclick="deleteProduct(${product.id})" title="Delete">🗑️</button>
                        </div>
                    </div>
                `;
        }).join('');

        document.getElementById('productCount').textContent = `${products.length} products`;
      }

      // Get stock status and CSS class
      function getStockStatus(product) {
        if (product.stock === 0) {
          return { class: 'low', text: 'Out of Stock' };
        } else if (product.stock <= product.threshold) {
          return { class: 'medium', text: 'Low Stock' };
        } else {
          return { class: 'high', text: 'In Stock' };
        }
      }

      // Get status CSS class
      function getStatusClass(status) {
        switch (status) {
          case 'active': return 'status-active';
          case 'low': return 'status-low';
          case 'out': return 'status-out';
          default: return 'status-active';
        }
      }

      // Get status display text
      function getStatusText(status) {
        switch (status) {
          case 'active': return 'Active';
          case 'low': return 'Low Stock';
          case 'out': return 'Out of Stock';
          default: return 'Active';
        }
      }

      // Update statistics
      function updateStats() {
        const totalProducts = inventory.length;
        const activeProducts = inventory.filter(p => p.status === 'active').length;
        const lowStockProducts = inventory.filter(p => p.stock <= p.threshold && p.stock > 0).length;
        const outOfStockProducts = inventory.filter(p => p.stock === 0).length;
        const totalValue = inventory.reduce((sum, p) => sum + (p.price * p.stock), 0);

        document.getElementById('totalProducts').textContent = totalProducts;
        document.getElementById('activeProducts').textContent = activeProducts;
        document.getElementById('lowStockProducts').textContent = lowStockProducts;
        document.getElementById('outOfStockProducts').textContent = outOfStockProducts;
        document.getElementById('totalInventoryValue').textContent = `$${(totalValue / 1000).toFixed(1)}K`;
      }

      // Filter products
      function filterProducts() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const categoryFilter = document.getElementById('categoryFilter').value;
        const statusFilter = document.getElementById('statusFilter').value;

        const filteredProducts = inventory.filter(product => {
          const matchesSearch = product.name.toLowerCase().includes(searchTerm) ||
            product.sku.toLowerCase().includes(searchTerm);
          const matchesCategory = !categoryFilter || product.category === categoryFilter;
          const matchesStatus = !statusFilter || product.status === statusFilter;

          return matchesSearch && matchesCategory && matchesStatus;
        });

        renderInventoryTable(filteredProducts);
      }

      // Open add product modal
      function openAddProductModal() {
        editingProductId = null;
        document.getElementById('modalTitle').textContent = 'Add New Product';
        document.getElementById('productForm').reset();
        document.getElementById('productModal').style.display = 'block';
      }

      // Edit product
      function editProduct(productId) {
        editingProductId = productId;
        const product = inventory.find(p => p.id === productId);

        if (product) {
          document.getElementById('modalTitle').textContent = 'Edit Product';
          document.getElementById('productName').value = product.name;
          document.getElementById('productSku').value = product.sku;
          document.getElementById('productCategory').value = product.category;
          document.getElementById('productPrice').value = product.price;
          document.getElementById('productStock').value = product.stock;
          document.getElementById('productThreshold').value = product.threshold;
          document.getElementById('productModal').style.display = 'block';
        }
      }

      // Close product modal
      function closeProductModal() {
        document.getElementById('productModal').style.display = 'none';
        editingProductId = null;
      }

      // Save product
      function saveProduct(event) {
        event.preventDefault();

        const productData = {
          name: document.getElementById('productName').value,
          sku: document.getElementById('productSku').value,
          category: document.getElementById('productCategory').value,
          price: parseFloat(document.getElementById('productPrice').value),
          stock: parseInt(document.getElementById('productStock').value),
          threshold: parseInt(document.getElementById('productThreshold').value)
        };

        if (editingProductId) {
          // Update existing product
          const index = inventory.findIndex(p => p.id === editingProductId);
          if (index !== -1) {
            inventory[index] = { ...inventory[index], ...productData };
            inventory[index].status = getProductStatus(inventory[index]);
          }
        } else {
          // Add new product
          const newProduct = {
            id: Math.max(...inventory.map(p => p.id)) + 1,
            ...productData,
            icon: getProductIcon(productData.category),
            status: getProductStatus(productData)
          };
          inventory.push(newProduct);
        }

        closeProductModal();
        renderInventoryTable();
        updateStats();
        filterProducts(); // Reapply filters
      }

      // Get product status based on stock and threshold
      function getProductStatus(product) {
        if (product.stock === 0) return 'out';
        if (product.stock <= product.threshold) return 'low';
        return 'active';
      }

      // Get product icon based on category
      function getProductIcon(category) {
        switch (category) {
          case 'apparel': return '👕';
          case 'accessories': return '👜';
          case 'home': return '🏠';
          case 'stationery': return '📓';
          default: return '📦';
        }
      }

      // Update stock
      function updateStock(productId) {
        const newStock = prompt('Enter new stock quantity:');
        if (newStock !== null && !isNaN(newStock)) {
          const product = inventory.find(p => p.id === productId);
          if (product) {
            product.stock = parseInt(newStock);
            product.status = getProductStatus(product);
            renderInventoryTable();
            updateStats();
            filterProducts();
          }
        }
      }

      // Delete product
      function deleteProduct(productId) {
        if (confirm('Are you sure you want to delete this product?')) {
          inventory = inventory.filter(p => p.id !== productId);
          renderInventoryTable();
          updateStats();
          filterProducts();
        }
      }

      // Export inventory to CSV
      function exportInventory() {
        const csvData = [
          ['Product Name', 'SKU', 'Category', 'Price', 'Stock', 'Threshold', 'Status', 'Value'],
          ...inventory.map(product => [
            product.name,
            product.sku,
            product.category,
            product.price,
            product.stock,
            product.threshold,
            getStatusText(product.status),
            (product.price * product.stock).toFixed(2)
          ])
        ];

        const csvString = csvData.map(row => row.join(',')).join('\n');
        const blob = new Blob([csvString], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `freshthreads-inventory-${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }

      // Close modal when clicking outside
      window.onclick = function (event) {
        const modal = document.getElementById('productModal');
        if (event.target === modal) {
          closeProductModal();
        }
      };

      // Initialize page when DOM is loaded
      document.addEventListener('DOMContentLoaded', initializePage);
    </script>
  </body>

</html>
