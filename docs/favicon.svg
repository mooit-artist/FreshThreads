<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff0000;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff0000;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#ff0000" stroke-width="2"/>

  <!-- Crossed lines (needles/threads) -->
  <rect x="20" y="47" width="60" height="6" rx="3" fill="url(#crossGradient)" transform="rotate(45 50 50)" filter="url(#glow)"/>
  <rect x="20" y="47" width="60" height="6" rx="3" fill="url(#crossGradient)" transform="rotate(-45 50 50)" filter="url(#glow)"/>

  <!-- FT letters -->
  <text x="50" y="35" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900">FT</text>
  <text x="50" y="70" text-anchor="middle" fill="#ff0000" font-family="Impact, Arial Black, sans-serif" font-size="8" font-weight="900">LLC</text>
</svg>
