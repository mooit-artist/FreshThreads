# Kibana configuration for Security Onion
server.name: kibana
server.host: "0.0.0.0"
server.port: 5601
elasticsearch.hosts: ["http://elasticsearch:9200"]

# Security settings
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "12345678901234567890123456789012"

# Logging
logging.appenders:
  file:
    type: file
    fileName: /usr/share/kibana/logs/kibana.log
    layout:
      type: json
logging.root:
  level: info
  appenders:
    - default
    - file

# Monitoring
monitoring.kibana.collection.enabled: false
monitoring.ui.container.elasticsearch.enabled: false

# Maps
map.includeElasticMapsService: true

# Telemetry
telemetry.enabled: false
telemetry.optIn: false

# Dashboard settings
kibana.index: ".kibana-so"
kibana.defaultAppId: "dashboard/security-overview"

# Custom branding for Security Onion
server.customResponseHeaders:
  "X-Content-Type-Options": "nosniff"
  "X-Frame-Options": "DENY"
  "X-XSS-Protection": "1; mode=block"
