# Logstash pipeline configuration for Security Onion
# Processes various log types including Suricata, Zeek, and system logs

input {
  # Beats input for Filebeat
  beats {
    port => 5044
    host => "0.0.0.0"
  }

  # TCP input for general logs
  tcp {
    port => 5000
    codec => json_lines
  }

  # HTTP input for webhook-style logs
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Add common fields
  mutate {
    add_field => { "[@metadata][so_processed]" => "true" }
    add_field => { "[@metadata][so_timestamp]" => "%{+YYYY.MM.dd}" }
  }

  # Process Suricata logs
  if [fields][log_type] == "suricata" or "suricata" in [tags] {
    # Parse Suricata JSON format
    json {
      source => "message"
    }

    # Add Suricata-specific fields
    mutate {
      add_field => { "event_type" => "ids" }
      add_field => { "tool" => "suricata" }
    }

    # Parse timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
    }

    # GeoIP enrichment for source and destination IPs
    if [src_ip] {
      geoip {
        source => "src_ip"
        target => "src_geoip"
      }
    }

    if [dest_ip] {
      geoip {
        source => "dest_ip"
        target => "dest_geoip"
      }
    }
  }

  # Process Zeek logs
  else if [fields][log_type] == "zeek" or "zeek" in [tags] {
    # Parse Zeek TSV format
    if [message] =~ /^#/ {
      drop { }
    }

    # Add Zeek-specific fields
    mutate {
      add_field => { "event_type" => "nsm" }
      add_field => { "tool" => "zeek" }
    }

    # Parse common Zeek fields based on log type
    if [source] =~ /conn\.log/ {
      csv {
        columns => ["ts", "uid", "id_orig_h", "id_orig_p", "id_resp_h", "id_resp_p", "proto", "service", "duration", "orig_bytes", "resp_bytes", "conn_state", "local_orig", "local_resp", "missed_bytes", "history", "orig_pkts", "orig_ip_bytes", "resp_pkts", "resp_ip_bytes", "tunnel_parents"]
        separator => "	"
      }
    }

    # Convert Zeek timestamp
    if [ts] {
      date {
        match => [ "ts", "UNIX" ]
      }
    }
  }

  # Process system logs
  else if [fields][log_type] == "syslog" or "syslog" in [tags] {
    grok {
      match => { "message" => "%{SYSLOGTIMESTAMP:syslog_timestamp} %{IPORHOST:syslog_server} %{DATA:syslog_program}(?:\[%{POSINT:syslog_pid}\])?: %{GREEDYDATA:syslog_message}" }
    }

    date {
      match => [ "syslog_timestamp", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss" ]
    }

    mutate {
      add_field => { "event_type" => "syslog" }
      add_field => { "tool" => "syslog" }
    }
  }

  # Process FreshThreads application logs
  else if [fields][log_type] == "freshthreads" or "freshthreads" in [tags] {
    # Parse application-specific logs
    if [source] =~ /nginx/ {
      grok {
        match => { "message" => "%{NGINXACCESS}" }
      }

      mutate {
        add_field => { "event_type" => "web_access" }
        add_field => { "tool" => "nginx" }
      }
    }

    # Parse Node.js application logs
    else if [source] =~ /node/ {
      json {
        source => "message"
      }

      mutate {
        add_field => { "event_type" => "application" }
        add_field => { "tool" => "nodejs" }
      }
    }
  }

  # Clean up fields
  mutate {
    remove_field => [ "host", "agent", "ecs", "input", "log" ]
  }

  # Add final processing timestamp
  ruby {
    code => "event.set('processing_time', Time.now.utc.iso8601)"
  }
}

output {
  # Output to Elasticsearch with dynamic index naming
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "security-onion-%{event_type}-%{+YYYY.MM.dd}"

    # Template for index mapping
    template_name => "security-onion"
    template_pattern => "security-onion-*"
    template => "/usr/share/logstash/templates/security-onion.json"
    template_overwrite => true
  }

  # Debug output (comment out in production)
  # stdout {
  #   codec => rubydebug
  # }
}
