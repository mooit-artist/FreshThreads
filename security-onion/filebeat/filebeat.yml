# Filebeat configuration for Security Onion
filebeat.inputs:
  # Suricata logs
  - type: log
    enabled: true
    paths:
      - /host/var/log/suricata/eve.json
    fields:
      log_type: suricata
    fields_under_root: false
    json.keys_under_root: true
    json.overwrite_keys: true
    tags: ["suricata", "ids", "json"]

  # Zeek logs
  - type: log
    enabled: true
    paths:
      - /host/var/log/zeek/*.log
    fields:
      log_type: zeek
    fields_under_root: false
    tags: ["zeek", "nsm"]
    exclude_lines: ['^#']

  # System logs
  - type: log
    enabled: true
    paths:
      - /host/var/log/syslog
      - /host/var/log/messages
      - /host/var/log/auth.log
      - /host/var/log/secure
    fields:
      log_type: syslog
    fields_under_root: false
    tags: ["syslog", "system"]

  # Docker container logs
  - type: container
    enabled: true
    paths:
      - '/host/var/lib/docker/containers/*/*.log'
    fields:
      log_type: docker
    fields_under_root: false
    tags: ["docker", "container"]

  # FreshThreads application logs
  - type: log
    enabled: true
    paths:
      - /host/var/log/freshthreads/*.log
      - /host/var/log/nginx/access.log
      - /host/var/log/nginx/error.log
    fields:
      log_type: freshthreads
    fields_under_root: false
    tags: ["freshthreads", "application"]

# Filebeat modules
filebeat.config.modules:
  path: ${path.config}/modules.d/*.yml
  reload.enabled: false

# Output configuration
output.logstash:
  hosts: ["logstash:5044"]
  compression_level: 3
  bulk_max_size: 2048
  template.name: "filebeat"
  template.pattern: "filebeat-*"

# Logging configuration
logging.level: info
logging.to_files: true
logging.files:
  path: /usr/share/filebeat/logs
  name: filebeat.log
  keepfiles: 7
  permissions: 0644

# Monitoring
monitoring.enabled: false

# Processors
processors:
  - add_host_metadata:
      when.not.contains.tags: forwarded
  - add_docker_metadata: ~
  - add_kubernetes_metadata: ~

# Index lifecycle management
setup.ilm.enabled: false
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0
  index.refresh_interval: 5s

# Security settings
ssl.verification_mode: none
