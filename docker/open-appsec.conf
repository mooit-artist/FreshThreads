# OpenAppSec Configuration for FreshThreads
# Provides comprehensive web application security

# Basic settings
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyNoFilesLimit 131072
SecRequestBodyInMemoryLimit 131072
SecRequestBodyLimitAction Reject

# Response body settings
SecResponseBodyAccess Off
SecResponseBodyMimeType text/plain text/html text/xml

# File upload settings
SecFileSystem /tmp
SecUploadDir /tmp
SecUploadKeepFiles Off

# Audit settings
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABDEFHIJZ
SecAuditLogType Serial
SecAuditLog /var/log/nano_agent/modsec_audit.log

# Debug settings
SecDebugLog /var/log/nano_agent/modsec_debug.log
SecDebugLogLevel 0

# Temporary directory
SecTmpDir /tmp

# Data directory
SecDataDir /tmp

# Include OWASP Core Rule Set
Include /etc/cp/conf/crs-setup.conf
Include /etc/cp/conf/rules/*.conf

# Custom rules for FreshThreads
SecRule REQUEST_HEADERS:Host "!^freshthreadsllc\.com$" \
    "id:1001,\
    phase:1,\
    block,\
    msg:'Invalid Host header',\
    logdata:'Host: %{REQUEST_HEADERS.host}'"

# Block common attack patterns
SecRule ARGS "@detectSQLi" \
    "id:1002,\
    phase:2,\
    block,\
    msg:'SQL Injection Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

SecRule ARGS "@detectXSS" \
    "id:1003,\
    phase:2,\
    block,\
    msg:'XSS Attack Detected',\
    logdata:'Matched Data: %{MATCHED_VAR} found within %{MATCHED_VAR_NAME}'"

# Rate limiting
SecRule IP:REQUESTS "@gt 100" \
    "id:1004,\
    phase:1,\
    deny,\
    status:429,\
    msg:'Rate limit exceeded',\
    expirevar:IP.REQUESTS=60"

SecAction "id:1005,phase:1,nolog,pass,initcol:IP=%{REMOTE_ADDR},setvar:IP.REQUESTS=+1"

# Protect sensitive files
SecRule REQUEST_FILENAME "@rx (?:\.(?:bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)|~)$" \
    "id:1006,\
    phase:1,\
    block,\
    msg:'Attempt to access sensitive file'"

# Content-Type validation
SecRule REQUEST_HEADERS:Content-Type "!@rx ^(?:application/(?:x-www-form-urlencoded|json)|multipart/form-data|text/plain)(?:;.*)?$" \
    "id:1007,\
    phase:1,\
    block,\
    msg:'Invalid Content-Type header'"
