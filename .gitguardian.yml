# GitGuardian configuration for FreshThreads
paths-ignore:
  # Ignore build/generated directories
  - "ComfyUI/**"
  - "advanced-design-pipeline/**"
  - "design-output/**"
  - "node_modules/**"
  - ".git/**"
  - ".venv/**"
  - "__pycache__/**"

  # Ignore report and log files
  - "*-report.json"
  - "*.log"
  - "test-reports/**"
  - "security-reports/**"

  # Ignore specific files with placeholder values
  - "docs/assets/products-config.json"

  # Ignore file extensions that commonly have false positives
  - "*.pyc"
  - "*.pyo"
  - "*.jpg"
  - "*.jpeg"
  - "*.png"
  - "*.gif"
  - "*.svg"
  - "*.ico"
  - "*.woff"
  - "*.woff2"
  - "*.ttf"
  - "*.eot"

patterns-ignore:
  # Ignore common patterns that are not secrets
  - "test*"
  - "example*"
  - "demo*"
  - "placeholder*"
  - "YOUR_*"
  - "your_*"
  - "process.env.*"
  - "os.getenv*"
  - "config.*"
