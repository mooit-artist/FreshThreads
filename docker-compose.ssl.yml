# Fresh Threads LLC - HTTPS Production Deployment
# Docker Compose configuration with SSL/TLS support

version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.ssl
    container_name: freshthreads-frontend-https
    restart: unless-stopped
    ports:
      - '18080:80' # HTTP (redirects to HTTPS)
      - '18443:443' # HTTPS
    networks:
      - freshthreads-network
    depends_on:
      - backend
    environment:
      - NODE_ENV=production
    volumes:
      - ./logs/nginx:/var/log/nginx
    healthcheck:
      test: ['CMD', 'curl', '-f', '-k', 'https://localhost:443/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend-ssl
    container_name: freshthreads-backend-https
    restart: unless-stopped
    ports:
      - '18444:8443' # HTTPS Backend API
    networks:
      - freshthreads-network
    environment:
      - PRINTIFY_API_KEY=${PRINTIFY_API_KEY}
      - PRINTIFY_SHOP_ID=${PRINTIFY_SHOP_ID}
      - FLASK_ENV=production
    volumes:
      - ./logs/backend:/app/logs
    healthcheck:
      test: ['CMD', 'curl', '-f', '-k', 'https://localhost:8443/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  freshthreads-network:
    driver: bridge
    name: freshthreads-https-network

volumes:
  nginx_logs:
    driver: local
  backend_logs:
    driver: local
