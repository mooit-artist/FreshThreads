# SonarQube Quality Profile for FreshThreads
# Custom rules and configurations for web development

# JavaScript/TypeScript Rules
sonar.javascript.environments=browser,jquery
sonar.javascript.node.version=18
sonar.javascript.file.suffixes=.js,.jsx

# CSS Rules
sonar.css.file.suffixes=.css,.scss,.sass,.less

# HTML Rules
sonar.html.file.suffixes=.html,.htm,.xhtml,.shtml

# General Quality Settings
sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/test/**,**/tests/**,**/node_modules/**

# Security Rules - Enhanced for e-commerce
sonar.security.hotspots.inheritFromParent=true

# Custom Quality Profile Rules for FreshThreads
# Web Development Best Practices

# JavaScript Specific Rules
javascript:S1192=MAJOR    # String literals should not be duplicated
javascript:S138=MAJOR     # Functions should not have too many lines
javascript:S1541=MAJOR    # Functions should not be too complex
javascript:S2228=INFO     # Console logging (allowed in development)
javascript:S1134=MINOR    # Track uses of FIXME tags

# CSS Specific Rules
css:S4658=MINOR          # Vendor prefixes (allowed for compatibility)
css:S4659=MAJOR          # Only use shorthand properties when all values are defined
css:S4661=MAJOR          # Empty declarations should be removed

# HTML Specific Rules
Web:DoctypePresenceCheck=MAJOR     # HTML documents should have DOCTYPE
Web:PageWithoutTitleCheck=MAJOR    # Pages should have title
Web:ImgWithoutAltCheck=BLOCKER     # Images should have alt attribute
Web:LinkToImageCheck=MINOR         # Links to images should not be used

# Security-focused rules for e-commerce
javascript:S2076=BLOCKER  # OS commands should not be vulnerable to injection
javascript:S2083=BLOCKER  # I/O function calls should not be vulnerable to path injection
javascript:S2631=BLOCKER  # Regular expressions should not be vulnerable to Denial of Service
javascript:S3649=BLOCKER  # Database queries should not be vulnerable to injection

# Performance Rules
javascript:S3776=MAJOR    # Cognitive Complexity should be reasonable
css:S4660=MAJOR          # Only use !important when absolutely necessary

# E-commerce Specific Custom Rules
# Payment processing security
javascript:S2092=BLOCKER  # Cookies should be "secure" in HTTPS context
javascript:S2255=BLOCKER  # Cookies should be written only over HTTPS
javascript:S4817=BLOCKER  # Performing HTTP requests is security-sensitive

# Data protection
javascript:S2068=BLOCKER  # Credentials should not be hard-coded
javascript:S1313=MAJOR    # IP addresses should not be hardcoded

# Accessibility Rules (Important for e-commerce)
Web:S5254=MAJOR          # Color alone should not be used to convey information
Web:S5256=MAJOR          # Tables should have headers
Web:BoldAndItalicTagsCheck=MINOR  # Bold and italic tags should not be used

# SEO and Performance
Web:MetaRefreshCheck=MAJOR        # Meta refresh should not be used
Web:InlineStyleCheck=MINOR        # Inline styles should be avoided

# Maintainability
javascript:S1301=MAJOR    # Switch statements should have at least 3 cases
javascript:S3923=MAJOR    # All branches in conditional should be reachable
css:S4654=MAJOR          # Duplicated properties should be removed

# Documentation
javascript:S1133=INFO     # Deprecated code should be removed
javascript:S1135=MINOR    # Track uses of TODO tags

# Quality Gate Conditions
# Coverage
sonar.coverage.exclusions=**/vendor/**,**/node_modules/**,**/*.min.js,**/*.min.css

# Duplication
sonar.cpd.exclusions=**/*.min.js,**/*.min.css,**/vendor/**

# Size Metrics
sonar.size.max=50000      # Maximum file size in lines

# Complexity Metrics
sonar.complexity.max=15   # Maximum cyclomatic complexity per function
