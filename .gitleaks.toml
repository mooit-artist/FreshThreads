# Gitleaks configuration for FreshThreads
# Documentation: https://github.com/gitleaks/gitleaks

[extend]
# Use the default gitleaks rules as base
useDefault = true

[[rules]]
id = "printify-api-key"
description = "Printify API Key"
regex = '''(?i)printify[_-]?api[_-]?key['":\s=]*[A-Za-z0-9_-]{32,}'''
keywords = ["printify"]

[[rules]]
id = "paypal-client-id"
description = "PayPal Client ID"
regex = '''(?i)paypal[_-]?client[_-]?id['":\s=]*A[A-Za-z0-9_-]{79,}'''
keywords = ["paypal", "client_id"]

[[rules]]
id = "paypal-client-secret"
description = "PayPal Client Secret"
regex = '''(?i)paypal[_-]?client[_-]?secret['":\s=]*E[A-Za-z0-9_-]{31,}'''
keywords = ["paypal", "client_secret"]

[[rules]]
id = "github-token"
description = "GitHub Personal Access Token"
regex = '''(?i)github[_-]?token['":\s=]*ghp_[A-Za-z0-9_]{36}'''
keywords = ["github", "token", "ghp_"]

[[rules]]
id = "docker-hub-token"
description = "Docker Hub Access Token"
regex = '''(?i)docker[_-]?hub[_-]?token['":\s=]*dckr_pat_[A-Za-z0-9_-]{42}'''
keywords = ["docker", "hub", "token"]

[allowlist]
description = "Global allow list"
regexes = [
    # Allow placeholder values
    '''YOUR_PRINTIFY_API_KEY_HERE''',
    '''your_printify_api_key''',
    '''YOUR_PAYPAL_CLIENT_ID''',
    '''your_client_id''',
    '''YOUR_PAYPAL_CLIENT_SECRET''',
    '''your_client_secret''',
    '''process\.env\.''',
    '''os\.getenv''',
    '''env\.''',
    '''config\.''',
    # Allow test/example values
    '''test[_-]?key''',
    '''example[_-]?key''',
    '''demo[_-]?key''',
    '''fake[_-]?key''',
    '''placeholder''',
    # Allow short or generic values
    '''key['":\s=]*[A-Za-z0-9_-]{1,15}['";\s]''',
    # Allow common false positives
    '''charset=utf-8''',
    '''base64''',
    '''localhost''',
    '''127\.0\.0\.1''',
]

paths = [
    # Ignore generated/build files
    '''docs/assets/products-config\.json''',
    '''ComfyUI/.*''',
    '''advanced-design-pipeline/.*''',
    '''design-output/.*''',
    '''node_modules/.*''',
    '''\.git/.*''',
    '''\.venv/.*''',
    '''__pycache__/.*''',
    '''\.pyc$''',
    # Ignore reports and logs
    '''.*-report\.json''',
    '''.*\.log''',
    '''test-reports/.*''',
    '''security-reports/.*''',
]
