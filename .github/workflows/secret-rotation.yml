name: Secret Rotation with Bitwarden

on:
  schedule:
    # Run monthly on the 1st at 2 AM UTC
    - cron: '0 2 1 * *'
  workflow_dispatch:
    inputs:
      secrets_to_rotate:
        description: 'Comma-separated list of secrets to rotate (DOCKER_PASSWORD,SONAR_TOKEN,SLACK_WEBHOOK)'
        required: false
        default: 'all'

env:
  BW_CLIENTID: ${{ secrets.BW_CLIENTID }}
  BW_CLIENTSECRET: ${{ secrets.BW_CLIENTSECRET }}

jobs:
  rotate-secrets:
    name: Rotate Secrets via Bitwarden
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bitwarden CLI
        run: |
          wget https://github.com/bitwarden/clients/releases/latest/download/bw-linux.zip
          unzip bw-linux.zip
          chmod +x bw
          sudo mv bw /usr/local/bin/

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl

      - name: Authenticate with Bitwarden
        run: |
          # Login using API key (recommended for CI/CD)
          bw config server https://vault.bitwarden.com
          BW_SESSION=$(bw login --apikey --raw)
          echo "BW_SESSION=$BW_SESSION" >> $GITHUB_ENV

      - name: Check secret expiration
        id: check-expiration
        run: |
          # Get secrets from Bitwarden and check last rotation dates
          SECRETS_TO_ROTATE=""

          # Check Docker token (rotate every 6 months)
          DOCKER_LAST_UPDATE=$(bw list items --search "FreshThreads-DOCKER_PASSWORD" --session "$BW_SESSION" | jq -r '.[0].revisionDate // empty')
          if [ -n "$DOCKER_LAST_UPDATE" ]; then
            DOCKER_AGE=$(( ($(date +%s) - $(date -d "$DOCKER_LAST_UPDATE" +%s)) / 86400 ))
            if [ $DOCKER_AGE -gt 180 ]; then
              SECRETS_TO_ROTATE="$SECRETS_TO_ROTATE,DOCKER_PASSWORD"
            fi
          fi

          # Check SonarQube token (rotate every 6 months)
          SONAR_LAST_UPDATE=$(bw list items --search "FreshThreads-SONAR_TOKEN" --session "$BW_SESSION" | jq -r '.[0].revisionDate // empty')
          if [ -n "$SONAR_LAST_UPDATE" ]; then
            SONAR_AGE=$(( ($(date +%s) - $(date -d "$SONAR_LAST_UPDATE" +%s)) / 86400 ))
            if [ $SONAR_AGE -gt 180 ]; then
              SECRETS_TO_ROTATE="$SECRETS_TO_ROTATE,SONAR_TOKEN"
            fi
          fi

          echo "secrets_to_rotate=${SECRETS_TO_ROTATE#,}" >> $GITHUB_OUTPUT

      - name: Create secret rotation issue
        if: steps.check-expiration.outputs.secrets_to_rotate != ''
        uses: actions/github-script@v7
        with:
          script: |
            const secretsToRotate = '${{ steps.check-expiration.outputs.secrets_to_rotate }}';

            const issueBody = `
            ## 🔄 Secret Rotation Required

            The following secrets need to be rotated:

            ${secretsToRotate.split(',').map(s => `- \`${s}\``).join('\n')}

            ### Action Required:
            1. Run the secrets rotation workflow manually
            2. Or use the Bitwarden secrets manager script:
               \`\`\`bash
               ./testing/scripts/bitwarden-secrets-manager.sh
               \`\`\`

            ### Rotation Instructions:

            **Docker Hub Token:**
            1. Go to https://hub.docker.com/settings/security
            2. Revoke old token and generate new one
            3. Update in Bitwarden and GitHub

            **SonarQube Token:**
            1. Go to http://localhost:9000
            2. My Account → Security → Generate new token
            3. Update in Bitwarden and GitHub

            This issue was automatically created by the secret rotation workflow.
            `;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Secret Rotation Required',
              body: issueBody,
              labels: ['security', 'maintenance']
            });

      - name: Notify team via Slack
        if: steps.check-expiration.outputs.secrets_to_rotate != ''
        run: |
          SECRETS="${{ steps.check-expiration.outputs.secrets_to_rotate }}"
          curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\":\"🔄 Secret rotation required for FreshThreads: $SECRETS\"}" \
            "${{ secrets.SLACK_WEBHOOK }}" || true

      - name: Lock Bitwarden vault
        if: always()
        run: |
          bw lock --session "$BW_SESSION" || true

  backup-secrets-inventory:
    name: Backup Secrets Inventory
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Bitwarden CLI
        run: |
          wget https://github.com/bitwarden/clients/releases/latest/download/bw-linux.zip
          unzip bw-linux.zip
          chmod +x bw
          sudo mv bw /usr/local/bin/

      - name: Authenticate with Bitwarden
        run: |
          bw config server https://vault.bitwarden.com
          BW_SESSION=$(bw login --apikey --raw)
          echo "BW_SESSION=$BW_SESSION" >> $GITHUB_ENV

      - name: Generate secrets inventory
        run: |
          # Create backup of secrets metadata (not values)
          cat > secrets-inventory-backup.json << EOF
          {
            "generated": "$(date -u +"%Y-%m-%d %H:%M:%S UTC")",
            "repository": "mooit-artist/FreshThreads",
            "secrets": $(bw list items --search "FreshThreads-" --session "$BW_SESSION" | jq '[.[] | {name: .name, id: .id, lastUpdated: .revisionDate}]')
          }
          EOF

      - name: Upload inventory backup
        uses: actions/upload-artifact@v3
        with:
          name: secrets-inventory-backup
          path: secrets-inventory-backup.json
          retention-days: 30

      - name: Lock Bitwarden vault
        if: always()
        run: |
          bw lock --session "$BW_SESSION" || true
