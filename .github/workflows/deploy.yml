name: Deploy FreshThreads with PayPal Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.9'

jobs:
  test:
    name: Test PayPal Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install requests python-dotenv

      - name: Configure PayPal from GitHub Secrets
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          BUSINESS_WEBSITE: ${{ secrets.BUSINESS_WEBSITE }}
          PAYPAL_WEBHOOK_URL: ${{ secrets.PAYPAL_WEBHOOK_URL }}
          VALIDATE_CONFIG: 'false' # Skip validation in test environment
        run: |
          echo "🔧 Creating PayPal configuration from GitHub Secrets..."
          python scripts/create_config_from_secrets.py

      - name: Test PayPal API v2 Integration
        run: |
          echo "🧪 Testing PayPal API v2 connection..."
          python scripts/paypal_v2_api_integration.py --action test

      - name: Test PayPal Order Creation
        if: github.event_name != 'pull_request' # Only test orders on main branch
        run: |
          echo "🛍️ Testing PayPal order creation..."
          python scripts/paypal_v2_api_integration.py --action create-order

  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install Node.js dependencies
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Validate HTML
        run: |
          if command -v html-validate &> /dev/null; then
            echo "🔍 Validating HTML files..."
            html-validate docs/*.html || true
          else
            echo "⚠️ html-validate not installed, skipping HTML validation"
          fi

      - name: Format files
        run: |
          if command -v prettier &> /dev/null; then
            echo "✨ Formatting files..."
            prettier --check docs/*.html docs/**/*.css docs/**/*.js || true
          else
            echo "⚠️ prettier not installed, skipping formatting check"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: freshthreads-build
          path: |
            docs/
            config/
            !config/paypal-config.env  # Don't upload secrets
          retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Use environment for production deployments
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Configure PayPal for Production
        env:
          # Use sandbox secrets for now, switch to production when ready
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET_SANDBOX }}
          PAYPAL_ENVIRONMENT: ${{ secrets.PAYPAL_ENVIRONMENT }}
          PAYPAL_BUSINESS_EMAIL: ${{ secrets.PAYPAL_BUSINESS_EMAIL }}
          BUSINESS_WEBSITE: ${{ secrets.BUSINESS_WEBSITE }}
          PAYPAL_WEBHOOK_URL: ${{ secrets.PAYPAL_WEBHOOK_URL }}
          VALIDATE_CONFIG: 'false'
        run: |
          echo "🔧 Configuring PayPal for deployment..."
          pip install requests python-dotenv
          python scripts/create_config_from_secrets.py

      - name: Update PayPal integration in HTML
        env:
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID_SANDBOX }}
        run: |
          echo "🌐 Updating PayPal Client ID in web files..."
          if [ -f "docs/paypal-checkout.html" ]; then
            sed -i "s/YOUR_PAYPAL_CLIENT_ID/$PAYPAL_CLIENT_ID/g" docs/paypal-checkout.html
            echo "✅ PayPal Client ID updated in checkout page"
          fi

      - name: Configure Printify API for Production
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
        run: |
          echo "🛍️ Configuring Printify API for deployment..."
          if [ -f "docs/assets/js/config.js" ] && [ -n "$PRINTIFY_API_KEY" ]; then
            sed -i "s/YOUR_PRINTIFY_API_KEY_HERE/$PRINTIFY_API_KEY/g" docs/assets/js/config.js
            echo "✅ Printify API key updated in config.js"
          else
            echo "⚠️ Printify API key not found or config.js missing"
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v3

      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v2
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run security scan
        run: |
          echo "🔍 Running security checks..."

          # Check for exposed secrets in code
          if grep -r "PAYPAL_CLIENT_ID\|PAYPAL_CLIENT_SECRET\|PRINTIFY_API_KEY" --include="*.py" --include="*.js" --include="*.html" . | grep -v "YOUR_PAYPAL_CLIENT_ID\|YOUR_PRINTIFY_API_KEY" | grep -v "secrets\." | grep -v "#"; then
            echo "❌ Potential exposed secrets found!"
            exit 1
          else
            echo "✅ No exposed secrets found"
          fi

          # Check for secure HTTPS usage
          if grep -r "http://" --include="*.html" --include="*.js" docs/ | grep -v "localhost"; then
            echo "⚠️ Non-HTTPS URLs found (consider using HTTPS)"
          else
            echo "✅ All URLs use HTTPS"
          fi

  notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Notify deployment status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "🎉 FreshThreads deployed successfully!"
            echo "🌐 Site URL: https://mooit-artist.github.io/FreshThreads/"
            echo "💳 PayPal integration: Active"
          else
            echo "❌ Deployment failed"
          fi
