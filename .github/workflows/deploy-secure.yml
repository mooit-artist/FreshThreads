name: Deploy FreshThreads with Secure Secrets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json found, skipping npm install"
          fi

      - name: Create secure config file
        env:
          PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
          PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
          PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID }}
        run: |
          # Use our existing replacement script which has been tested and works
          echo "🔧 Replacing configuration placeholders with GitHub Secrets..."
          node testing/scripts/replace-config-placeholders.js

          # Verify the replacement worked
          if grep -q "STRIPE_PUBLISHABLE_KEY_PLACEHOLDER" docs/assets/js/config.js; then
            echo "❌ Stripe publishable key placeholder not replaced!"
            exit 1
          fi

          echo "✅ Secure config.js created successfully"

      - name: Validate configuration
        run: |
          # Check if config file exists
          if [ ! -f "docs/assets/js/config.js" ]; then
            echo "❌ Config file not found!"
            exit 1
          fi

          # Check if placeholders were replaced (should not contain placeholder text)
          if grep -q "_PLACEHOLDER" docs/assets/js/config.js; then
            echo "❌ Some placeholders were not replaced!"
            grep "_PLACEHOLDER" docs/assets/js/config.js
            exit 1
          fi

          echo "✅ Configuration validation passed - all placeholders replaced"

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        run: |
          # Configure git for the commit
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Add and commit the secure config file
          git add docs/assets/js/config.js

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "✅ No changes to config.js - already up to date"
          else
            git commit -m "🔐 AUTO: Update secure config.js with GitHub Secrets [skip ci]"
            git push origin main
            echo "✅ Secure configuration committed and pushed"
          fi

          echo "GitHub Pages will automatically deploy the updated content"

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Printify API**: $([ -n '${{ secrets.PRINTIFY_API_KEY }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
          echo "- **Printify Shop ID**: $([ -n '${{ secrets.PRINTIFY_SHOP_ID }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
          echo "- **Stripe Publishable**: $([ -n '${{ secrets.STRIPE_PUBLISHABLE_KEY }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
          echo "- **Stripe Secret**: $([ -n '${{ secrets.STRIPE_SECRET_KEY }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
          echo "- **Site URL**: https://freshthreadsllc.com/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Features" >> $GITHUB_STEP_SUMMARY
          echo "- API keys stored as GitHub Secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Config file generated at deployment time" >> $GITHUB_STEP_SUMMARY
          echo "- No sensitive data in repository" >> $GITHUB_STEP_SUMMARY
          echo "- Stripe payment integration secured" >> $GITHUB_STEP_SUMMARY
