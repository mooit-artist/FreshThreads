name: Deploy FreshThreads with Secure Secrets

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: |
        if [ -f package.json ]; then
          npm ci
        else
          echo "No package.json found, skipping npm install"
        fi

    - name: Create secure config file
      env:
        PRINTIFY_API_KEY: ${{ secrets.PRINTIFY_API_KEY }}
        PRINTIFY_SHOP_ID: ${{ secrets.PRINTIFY_SHOP_ID }}
        PRINTFUL_API_KEY: ${{ secrets.PRINTFUL_API_KEY }}
      run: |
        # Create secure config.js with environment variables
        cat > docs/assets/js/config.js << 'EOF'
        // Print-on-Demand Configuration - Generated by GitHub Actions
        // DO NOT EDIT - This file is automatically generated from GitHub Secrets

        window.podConfig = {
            // PRINTIFY CONFIGURATION
            printifyApiKey: '${{ secrets.PRINTIFY_API_KEY }}',
            printifyShopId: '${{ secrets.PRINTIFY_SHOP_ID }}',

            // PRINTFUL CONFIGURATION
            printfulApiKey: '${{ secrets.PRINTFUL_API_KEY }}',

            // DEPLOYMENT SETTINGS
            debug: false,
            testMode: false,

            // BUILD INFO
            buildTime: new Date().toISOString(),
            buildNumber: '${{ github.run_number }}',
            gitCommit: '${{ github.sha }}'
        };

        // Security: Log that config was loaded (without sensitive data)
        console.log('POD Config loaded - Build:', window.podConfig.buildNumber);
        EOF

        echo "✅ Secure config.js created"

    - name: Validate configuration
      run: |
        # Check if config file was created
        if [ ! -f "docs/assets/js/config.js" ]; then
          echo "❌ Config file not created!"
          exit 1
        fi

        # Check if secrets were properly substituted (without revealing them)
        if grep -q "YOUR_PRINTIFY_API_KEY_HERE" docs/assets/js/config.js; then
          echo "❌ Printify API key not substituted!"
          exit 1
        fi

        echo "✅ Configuration validation passed"

    - name: Build and prepare deployment
      run: |
        # Create deployment directory
        mkdir -p deployment

        # Copy all docs files
        cp -r docs/* deployment/

        # Ensure proper permissions
        find deployment -type f -name "*.html" -exec chmod 644 {} \;
        find deployment -type f -name "*.css" -exec chmod 644 {} \;
        find deployment -type f -name "*.js" -exec chmod 644 {} \;

        echo "✅ Deployment prepared"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./deployment
        force_orphan: true

    - name: Create deployment summary
      run: |
        echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Number**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Printify API**: $([ -n '${{ secrets.PRINTIFY_API_KEY }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
        echo "- **Printify Shop ID**: $([ -n '${{ secrets.PRINTIFY_SHOP_ID }}' ] && echo '✅ Configured' || echo '❌ Missing')" >> $GITHUB_STEP_SUMMARY
        echo "- **Site URL**: https://mooit-artist.github.io/FreshThreads/" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### 🔒 Security Features" >> $GITHUB_STEP_SUMMARY
        echo "- API keys stored as GitHub Secrets" >> $GITHUB_STEP_SUMMARY
        echo "- Config file generated at deployment time" >> $GITHUB_STEP_SUMMARY
        echo "- No sensitive data in repository" >> $GITHUB_STEP_SUMMARY
