# FreshThreads SonarQube Configuration
# E-commerce security focused settings

# Server settings
sonar.web.host=0.0.0.0
sonar.web.port=9000

# Database settings (configured via environment variables)
sonar.jdbc.username=${SONAR_JDBC_USERNAME}
sonar.jdbc.password=${SONAR_JDBC_PASSWORD}
sonar.jdbc.url=${SONAR_JDBC_URL}

# Security settings
sonar.forceAuthentication=true
sonar.security.realm=sonar

# E-commerce specific quality gates
sonar.qualitygate.wait=true

# HTML/CSS/JS analysis
sonar.html.file.suffixes=.html,.xhtml,.cshtml,.vbhtml,.aspx,.ascx,.rhtml,.erb,.ejs
sonar.css.file.suffixes=.css,.less,.scss
sonar.javascript.file.suffixes=.js,.jsx

# Security rules for e-commerce
sonar.security.hotspots.inheritFromParent=true
sonar.security.hotspots.enable=true

# PCI DSS compliance rules
sonar.inclusion.patterns=docs/**/*,scripts/**/*
sonar.exclusion.patterns=**/node_modules/**,**/*.min.js,**/*.min.css

# Custom rules for payment processing
sonar.custom.rules.payment.enabled=true
