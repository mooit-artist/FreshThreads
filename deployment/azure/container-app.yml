# Azure Container Apps Configuration for FreshThreads Backend
# Deploy with: az containerapp create --yaml container-app.yml

properties:
  environmentId: /subscriptions/{subscription-id}/resourceGroups/freshthreads-rg/providers/Microsoft.App/managedEnvironments/freshthreads-env
  configuration:
    ingress:
      external: true
      targetPort: 8000
      transport: http
      customDomains:
        - name: api.freshthreadsllc.com
          certificateId: /subscriptions/{subscription-id}/resourceGroups/freshthreads-rg/providers/Microsoft.App/managedEnvironments/freshthreads-env/certificates/api-cert
    secrets:
      - name: printify-api-key
        keyVaultUrl: https://freshthreads-kv.vault.azure.net/secrets/PRINTIFY-API-KEY
      - name: stripe-secret-key
        keyVaultUrl: https://freshthreads-kv.vault.azure.net/secrets/STRIPE-SECRET-KEY
      - name: paypal-client-secret
        keyVaultUrl: https://freshthreads-kv.vault.azure.net/secrets/PAYPAL-CLIENT-SECRET
    registries:
      - server: freshthreads.azurecr.io
        identity: /subscriptions/{subscription-id}/resourceGroups/freshthreads-rg/providers/Microsoft.ManagedIdentity/userAssignedIdentities/freshthreads-identity
  template:
    containers:
      - image: freshthreads.azurecr.io/backend:latest
        name: freshthreads-api
        env:
          - name: PRINTIFY_API_KEY
            secretRef: printify-api-key
          - name: STRIPE_SECRET_KEY
            secretRef: stripe-secret-key
          - name: PAYPAL_CLIENT_SECRET
            secretRef: paypal-client-secret
          - name: FLASK_ENV
            value: production
          - name: PORT
            value: "8000"
        resources:
          cpu: 0.25
          memory: 0.5Gi
    scale:
      minReplicas: 0
      maxReplicas: 10
      rules:
        - name: http-scale
          http:
            metadata:
              concurrentRequests: "100"
location: East US
resourceGroup: freshthreads-rg
name: freshthreads-api
type: Microsoft.App/containerApps
