version: '3.8'

services:
  # Development environment
  dev:
    build:
      context: .
      target: development
      dockerfile: Dockerfile
    ports:
      - '5500:5500'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - freshthreads-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:5500']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Testing environment
  test:
    build:
      context: .
      target: testing
      dockerfile: Dockerfile
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=test
    networks:
      - freshthreads-network
    command: >
      sh -c "
        echo '🧪 Running comprehensive tests...' &&
        make lint &&
        make validate &&
        make python-setup &&
        make analyze-html &&
        echo '✅ All tests completed successfully!'
      "

  # Production environment
  prod:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    ports:
      - '8080:80'
    networks:
      - freshthreads-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Security testing with OWASP ZAP
  security-test:
    image: owasp/zap2docker-stable
    command: >
      sh -c "
        echo '🔒 Starting security scan...' &&
        zap-baseline.py -t http://prod/ -J zap-report.json || true &&
        echo '📊 Security scan completed. Check zap-report.json for results.'
      "
    volumes:
      - ./security-reports:/zap/wrk:rw
    depends_on:
      - prod
    networks:
      - freshthreads-network

  # Performance testing with Apache Bench
  performance-test:
    image: alpine:latest
    command: >
      sh -c "
        apk add --no-cache apache2-utils curl &&
        echo '⚡ Running performance tests...' &&
        echo 'Testing homepage...' &&
        ab -n 100 -c 10 http://prod/ &&
        echo 'Testing static assets...' &&
        ab -n 50 -c 5 http://prod/styles/minimalistic.css &&
        echo '📊 Performance tests completed!'
      "
    depends_on:
      - prod
    networks:
      - freshthreads-network

  # SonarQube code quality analysis
  sonarqube-analysis:
    build:
      context: .
      dockerfile: docker/Dockerfile.sonar
    volumes:
      - .:/usr/src
      - sonar_cache:/opt/sonar-scanner/.sonar/cache
      - sonar_reports:/opt/reports
    environment:
      - SONAR_HOST_URL=http://host.docker.internal:9000
      - SONAR_PROJECT_KEY=freshthreads-llc
      - SONAR_LOGIN=${SONAR_TOKEN:-admin}
      - SONAR_PASSWORD=${SONAR_PASSWORD:-admin}
    networks:
      - freshthreads-network
    profiles:
      - analysis

networks:
  freshthreads-network:
    driver: bridge

volumes:
  node_modules:
  sonar_cache:
  sonar_reports:
