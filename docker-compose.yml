version: '3.8'

services:
  # Backend service - Printify Proxy API
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: freshthreads-backend
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - PRINTIFY_API_KEY=${PRINTIFY_API_KEY}
      - PRINTIFY_SHOP_ID=${PRINTIFY_SHOP_ID:-6563836}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PUBLISHABLE_KEY=${STRIPE_PUBLISHABLE_KEY}
    volumes:
      - logs:/app/logs
      - type: bind
        source: ./printify_proxy.py
        target: /app/printify_proxy.py
      - type: bind
        source: ./payment_api.py
        target: /app/payment_api.py
      - type: bind
        source: ./contact_api.py
        target: /app/contact_api.py
    networks:
      - freshthreads-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Frontend service - Nginx with static files
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: freshthreads-frontend
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      - backend
    volumes:
      - type: bind
        source: ./docs
        target: /usr/share/nginx/html
        read_only: true
    networks:
      - freshthreads-network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Development frontend (for local development)
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: freshthreads-frontend-dev
    ports:
      - '5500:5500'
    volumes:
      - ./docs:/app/docs
      - ./assets:/app/assets
    environment:
      - NODE_ENV=development
    depends_on:
      - backend
    networks:
      - freshthreads-network
    restart: unless-stopped
    profiles:
      - development

networks:
  freshthreads-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  logs:
    driver: local
