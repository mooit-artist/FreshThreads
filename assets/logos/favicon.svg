<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#cccccc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#000000" stroke="#ffffff" stroke-width="1"/>

  <!-- Crossed lines (Fresh Threads signature design) -->
  <rect x="28" y="47" width="44" height="3" rx="1.5" fill="url(#crossGradient)" transform="rotate(45 50 50)" filter="url(#subtleGlow)"/>
  <rect x="28" y="47" width="44" height="3" rx="1.5" fill="url(#crossGradient)" transform="rotate(-45 50 50)" filter="url(#subtleGlow)"/>

  <!-- Fresh Threads initials -->
  <text x="50" y="38" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="16" font-weight="900">FT</text>
  <text x="50" y="66" text-anchor="middle" fill="#ffffff" font-family="Impact, Arial Black, sans-serif" font-size="6" font-weight="900" letter-spacing="1px">LLC</text>
</svg>
