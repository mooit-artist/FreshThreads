# SonarQube Project Configuration for FreshThreads
# This file defines the analysis parameters for code quality scanning

# Project identification
sonar.projectKey=freshthreads-llc
sonar.projectName=FreshThreads LLC
sonar.projectVersion=1.0
sonar.organization=freshthreads

# Source code settings
sonar.sources=docs,scripts
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.javascript.file.suffixes=.js,.jsx
sonar.css.file.suffixes=.css,.scss,.sass
sonar.html.file.suffixes=.html,.htm,.xhtml

# Exclusions
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,**/*.min.js,**/*.min.css,**/venv/**,**/__pycache__/**,**/security-reports/**,**/test-reports/**

# Test exclusions
sonar.test.exclusions=**/node_modules/**,**/vendor/**

# Coverage settings (if available)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.python.coverage.reportPaths=coverage.xml

# Duplication settings
sonar.cpd.exclusions=**/*.min.js,**/*.min.css

# Analysis settings
sonar.analysis.mode=publish

# Quality gate settings
sonar.qualitygate.wait=true

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Rule customization
sonar.issue.ignore.multicriteria=e1,e2,e3

# Ignore HTML validation issues for generated content
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:DoctypePresenceCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/index.html

# Ignore CSS vendor prefixes
sonar.issue.ignore.multicriteria.e2.ruleKey=css:S4658
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.css

# Ignore JavaScript console statements in development
sonar.issue.ignore.multicriteria.e3.ruleKey=javascript:S2228
sonar.issue.ignore.multicriteria.e3.resourceKey=**/debug-*.js

# Plugin-specific settings
sonar.html.file.suffixes=.html,.htm
sonar.css.file.suffixes=.css
sonar.javascript.file.suffixes=.js

# Branch analysis (for CI/CD)
# sonar.branch.name=main
# sonar.pullrequest.key=
# sonar.pullrequest.branch=
# sonar.pullrequest.base=main

# Additional analysis parameters
sonar.log.level=INFO
sonar.verbose=false

# Custom properties for FreshThreads
sonar.projectDescription=Premium print-on-demand apparel store with Scandinavian minimalism design
sonar.links.homepage=https://freshthreadsllc.com
sonar.links.ci=https://github.com/mooit-artist/FreshThreads/actions
sonar.links.scm=https://github.com/mooit-artist/FreshThreads
sonar.links.issue=https://github.com/mooit-artist/FreshThreads/issues
